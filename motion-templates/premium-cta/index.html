<!doctype html>
<html
  data-composition-variables='[
    {"id":"text","type":"string","label":"CTA","default":"Sígueme para más"},
    {"id":"accent","type":"color","label":"Accent","default":"#D6A84F"}
  ]'
>
  <body>
    <div
      id="premium-cta"
      data-composition-id="premium-cta"
      data-width="1080"
      data-height="1920"
    >
      <section
        class="clip frame"
        data-start="0"
        data-duration="3"
        data-track-index="1"
      >
        <div class="cta">
          <span class="glint"></span>
          <p id="cta-text"></p>
        </div>
      </section>
    </div>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: transparent;
        font-family: Arial, Helvetica, sans-serif;
      }

      #premium-cta {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        color: #fff;
        background: transparent;
      }

      .frame {
        display: flex;
        width: 100%;
        height: 100%;
        padding: 0 104px 548px;
        align-items: flex-end;
        justify-content: center;
      }

      .cta {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 212px;
        overflow: hidden;
        padding: 38px 58px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 8px;
        background: linear-gradient(
          135deg,
          rgba(15, 15, 18, 0.7),
          rgba(24, 24, 28, 0.4)
        );
        box-shadow:
          0 40px 132px rgba(0, 0, 0, 0.52),
          inset 0 1px rgba(255, 255, 255, 0.18);
        animation-name: cta-rise;
        animation-duration: 760ms;
        animation-timing-function: cubic-bezier(0.18, 0.82, 0.22, 1);
        animation-iteration-count: 1;
        animation-fill-mode: both;
      }

      .glint {
        position: absolute;
        inset: 0 auto auto 58px;
        width: calc(100% - 116px);
        height: 10px;
        border-radius: 999px;
        background: var(--accent);
        box-shadow: 0 0 48px color-mix(in srgb, var(--accent) 64%, transparent);
      }

      p {
        max-width: 740px;
        margin: 0;
        font-size: 76px;
        font-weight: 800;
        line-height: 1.08;
        letter-spacing: 0;
        text-align: center;
        text-wrap: balance;
        text-shadow: 0 7px 22px rgba(0, 0, 0, 0.92);
      }

      @keyframes cta-rise {
        from {
          opacity: 0;
          transform: translateY(42px) scale(0.985);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
    </style>
    <script>
      const vars = window.__hyperframes.getVariables();
      document.documentElement.style.setProperty("--accent", vars.accent);
      document.getElementById("cta-text").textContent = vars.text;
    </script>
  </body>
</html>
